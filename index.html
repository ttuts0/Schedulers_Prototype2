<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathwise — Prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f7f7fc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .wrap { text-align: center; padding: 40px 24px; }
  .logo-mark { width: 56px; height: 56px; border-radius: 16px; background: #6C63FF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: #fff; margin: 0 auto 16px; }
  h1 { font-size: 28px; font-weight: 800; color: #1a1a2e; margin-bottom: 6px; }
  h1 span { color: #6C63FF; }
  .sub { font-size: 14px; color: #8888aa; margin-bottom: 40px; }
  .cards { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .card { background: #fff; border: 1px solid #eeeef5; border-radius: 16px; padding: 32px 36px; text-decoration: none; color: #1a1a2e; width: 240px; transition: all 0.15s; }
  .card:hover { border-color: #6C63FF; box-shadow: 0 4px 24px rgba(108,99,255,0.12); transform: translateY(-2px); }
  .card-icon { font-size: 32px; margin-bottom: 14px; }
  .card-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .card-desc { font-size: 12px; color: #8888aa; line-height: 1.5; }
  .card-link { display: inline-block; margin-top: 16px; font-size: 12px; font-weight: 600; color: #6C63FF; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-mark">P</div>
  <h1>Path<span>wise</span></h1>
  <p class="sub">Select a view to get started</p>
  <div class="cards">
    <a class="card" href="advisorView.html">
      <div class="card-icon">🧑‍🏫</div>
      <div class="card-title">Advisor View</div>
      <div class="card-desc">Monitor at-risk students, section demand alerts, cohort patterns, and dean reports.</div>
      <div class="card-link">Open →</div>
    </a>
    <a class="card" href="studentView.html">
      <div class="card-icon">🎓</div>
      <div class="card-title">Student View</div>
      <div class="card-desc">AI academic coach (Alex) and advisor notes hub.</div>
      <div class="card-link">Open →</div>
    </a>
  </div>
</div>
</body>
</html>
